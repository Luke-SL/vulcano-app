server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip básico para os assets do build
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets com hash no nome (js/css/imagens) podem ser cacheados agressivamente
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota cai no index.html (o Vue Router cuida do resto).
    # O app usa hash history (#/dashboard), então isso é mais rede de segurança
    # do que necessidade — mas evita 404 em acessos diretos por engano.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
